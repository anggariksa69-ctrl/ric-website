<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RIC — Kartu NFC & QR Google Review</title>
  <meta name="description" content="RIC membantu bisnis mendapatkan Google Review dengan kartu NFC dan QR Code yang praktis.">
  <meta name="theme-color" content="#1558d6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%231558d6'/%3E%3Ctext x='50' y='66' font-family='Arial' font-size='55' font-weight='700' text-anchor='middle' fill='white'%3ERIC%3C/text%3E%3C/svg%3E">
  <style>
    :root{
      --blue:#1558d6; --blue2:#0b3fa8; --ink:#101828; --muted:#667085;
      --line:#e5e7eb; --bg:#f7f9fc; --card:#fff; --gold:#f5b800; --green:#12a150;
      --shadow:0 20px 60px rgba(16,24,40,.10); --radius:24px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
    a{text-decoration:none;color:inherit}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .container{width:min(1120px,calc(100% - 40px));margin:auto}
    .nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;letter-spacing:-1px}
    .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),#3b82f6);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 10px 25px rgba(21,88,214,.25)}
    .navlinks{display:flex;gap:26px;color:#475467;font-weight:600;font-size:14px}
    .navlinks a:hover{color:var(--blue)}
    .nav-actions{display:flex;gap:10px}
    .btn{border:0;border-radius:13px;padding:12px 18px;font-weight:800;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--blue);color:#fff;box-shadow:0 10px 22px rgba(21,88,214,.20)}
    .btn-secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}
    .hero{padding:68px 0 80px;background:radial-gradient(circle at 80% 20%,rgba(21,88,214,.12),transparent 30%),linear-gradient(#fff,#f7f9fc)}
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#eaf1ff;color:var(--blue);font-size:13px;font-weight:800;margin-bottom:20px}
    h1{font-size:clamp(42px,6vw,70px);line-height:.98;letter-spacing:-3px;margin:0 0 22px}
    .hero p{font-size:18px;line-height:1.7;color:var(--muted);max-width:620px;margin:0 0 28px}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    .trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:#475467;font-size:13px;font-weight:700}
    .product-wrap{position:relative}
    .product-card{background:#fff;border:1px solid #edf0f5;border-radius:32px;padding:24px;box-shadow:var(--shadow);transform:rotate(1.2deg)}
    .product-card img{display:block;width:100%;border-radius:22px}
    .float-badge{position:absolute;right:-16px;bottom:28px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);font-size:13px;font-weight:800}
    section{padding:88px 0}
    .section-head{text-align:center;max-width:720px;margin:0 auto 44px}
    .section-head h2{font-size:42px;letter-spacing:-1.8px;margin:0 0 12px}
    .section-head p{color:var(--muted);font-size:17px;line-height:1.7;margin:0}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .step,.feature,.business,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:0 8px 30px rgba(16,24,40,.04)}
    .num{width:42px;height:42px;border-radius:14px;background:#eaf1ff;color:var(--blue);display:grid;place-items:center;font-weight:900;margin-bottom:20px}
    .step h3,.feature h3{margin:0 0 9px;font-size:20px}.step p,.feature p{color:var(--muted);line-height:1.65;margin:0}
    .features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .icon{font-size:25px;margin-bottom:18px}
    .businesses{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .business{text-align:center;padding:22px 14px;font-weight:800}
    .cta{background:linear-gradient(135deg,#0f4fc9,#1d68ed);color:#fff;border-radius:32px;padding:54px;display:flex;justify-content:space-between;gap:30px;align-items:center}
    .cta h2{font-size:38px;letter-spacing:-1.5px;margin:0 0 8px}.cta p{margin:0;color:#dbe8ff;line-height:1.6}
    .footer{padding:45px 0;border-top:1px solid var(--line);background:#fff}.footer-grid{display:flex;justify-content:space-between;gap:30px;align-items:flex-start}.footer small{color:var(--muted)}
    .page{min-height:calc(100vh - 76px);padding:50px 0 80px}
    .page-title{font-size:42px;letter-spacing:-1.5px;margin:0 0 10px}.page-sub{color:var(--muted);line-height:1.7;margin:0 0 28px}
    .manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    label{display:block;font-size:13px;font-weight:800;margin:0 0 7px}
    input,textarea{width:100%;border:1px solid #dfe3ea;border-radius:12px;padding:13px 14px;outline:0;background:#fff}
    input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(21,88,214,.08)}
    .field{margin-bottom:16px}
    .note{padding:13px 15px;border-radius:13px;background:#f2f6ff;color:#365a9b;font-size:13px;line-height:1.55;margin:14px 0}
    .status{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900}.active{background:#e8f8ef;color:#087a3e}.inactive{background:#fff5dc;color:#9a6700}
    .hidden{display:none!important}
    .center{max-width:560px;margin:auto}
    .success{background:#ecfdf3;color:#087a3e;padding:16px;border-radius:14px;font-weight:700;margin:16px 0}
    .error{background:#fff1f2;color:#b42318;padding:16px;border-radius:14px;font-weight:700;margin:16px 0}
    .qr{width:220px;height:220px;margin:15px auto;background:#fff;display:grid;place-items:center;border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .qr img{width:100%;height:100%;object-fit:contain}
    .dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}
    .stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat b{display:block;font-size:28px;margin-top:8px}.muted{color:var(--muted)}
    .faq{max-width:800px;margin:auto}.faq details{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px 20px;margin-bottom:10px}.faq summary{font-weight:800;cursor:pointer}.faq p{color:var(--muted);line-height:1.65}
    .review-box{text-align:center;max-width:650px;margin:80px auto}.stars{color:#f5b800;font-size:35px;letter-spacing:5px}
    @media(max-width:850px){.hero-grid,.manage-grid{grid-template-columns:1fr}.steps,.features{grid-template-columns:1fr}.businesses{grid-template-columns:repeat(2,1fr)}.navlinks{display:none}.cta,.footer-grid{flex-direction:column}.hero{padding-top:38px}h1{letter-spacing:-2px}.section-head h2{font-size:34px}}
    @media(max-width:520px){.container{width:min(100% - 24px,1120px)}.nav{height:68px}.nav-actions .btn-secondary{display:none}.product-card{padding:12px}.cta{padding:30px}.page-title{font-size:34px}.dashboard-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="app"></div>

<script>
const DEMO_CARDS = {
  "RIC-000001": {cardId:"RIC-000001",status:"active",businessName:"Demo Cafe",ownerName:"Demo Owner",phone:"+62 812-0000-0001",address:"Yogyakarta",googleReviewUrl:"https://www.google.com/maps/search/?api=1&query=Demo+Cafe",pin:"1234",createdAt:"2026-01-01",activatedAt:"2026-01-02",events:{nfc_visit:12,qr_visit:8,review_redirect:16}},
  "RIC-000002": {cardId:"RIC-000002",status:"inactive",businessName:"",ownerName:"",phone:"",address:"",googleReviewUrl:"",pin:"",createdAt:"2026-01-01",activatedAt:"",events:{nfc_visit:0,qr_visit:0,review_redirect:0}},
  "RIC-000003": {cardId:"RIC-000003",status:"active",businessName:"Demo Restaurant",ownerName:"Demo Owner",phone:"+62 812-0000-0003",address:"Sleman",googleReviewUrl:"https://www.google.com/maps/search/?api=1&query=Demo+Restaurant",pin:"5678",createdAt:"2026-01-01",activatedAt:"2026-01-04",events:{nfc_visit:21,qr_visit:15,review_redirect:30}}
};

function getCards(){
  const saved=localStorage.getItem("ric_cards");
  if(!saved){localStorage.setItem("ric_cards",JSON.stringify(DEMO_CARDS));return structuredClone(DEMO_CARDS)}
  return JSON.parse(saved);
}
function saveCards(c){localStorage.setItem("ric_cards",JSON.stringify(c))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function layout(content){
return `<header><div class="container nav">
<a class="brand" href="/"><span class="logo">RIC</span> RIC</a>
<nav class="navlinks"><a href="/">Beranda</a><a href="/#cara-kerja">Cara Kerja</a><a href="/kelola-kartu">Kelola Kartu</a><a href="/bantuan">Bantuan</a></nav>
<div class="nav-actions"><a class="btn btn-secondary" href="/kelola-kartu">Kelola Kartu</a><a class="btn btn-primary" href="/#produk">Pesan Kartu</a></div>
</div></header>${content}<footer class="footer"><div class="container footer-grid"><div><div class="brand"><span class="logo">RIC</span> RIC</div><small>Permudah pelanggan memberikan review.</small></div><div><strong>Customer Service</strong><br><a href="mailto:anggariksa69@gmail.com" style="color:#1558d6">anggariksa69@gmail.com</a></div><small>© 2026 RIC. All rights reserved.</small></div></footer>`;
}
function home(){
return layout(`
<main>
<section class="hero"><div class="container hero-grid">
<div><span class="eyebrow">● NFC + QR Google Review</span><h1>Review bisnis Anda, sekarang semudah <span style="color:#1558d6">tap.</span></h1><p>RIC membantu bisnis mendapatkan Google Review dengan kartu NFC dan QR Code yang praktis. Pelanggan cukup tap atau scan untuk menuju halaman review Anda.</p><div class="actions"><a class="btn btn-primary" href="/kelola-kartu">Kelola Kartu →</a><a class="btn btn-secondary" href="#cara-kerja">Pelajari Cara Kerja</a></div><div class="trust"><span>✓ NFC tanpa buka kamera</span><span>✓ QR sebagai alternatif</span><span>✓ Link review bisa diubah</span></div></div>
<div class="product-wrap"><div class="product-card"><img src="/assets/ric-card-reference.png" alt="Kartu RIC NFC dan QR Google Review"></div><div class="float-badge">📱 Tap → Review Google</div></div>
</div></section>
<section id="cara-kerja"><div class="container"><div class="section-head"><h2>Sesederhana itu.</h2><p>Satu kartu fisik, dua cara akses, satu tujuan: memudahkan pelanggan memberikan review.</p></div>
<div class="steps"><div class="step"><div class="num">01</div><h3>Tap atau Scan</h3><p>Pelanggan cukup mendekatkan smartphone ke kartu RIC atau scan QR Code.</p></div><div class="step"><div class="num">02</div><h3>Terhubung Otomatis</h3><p>RIC mengenali Card ID unik dan mengambil konfigurasi bisnis dari sistem.</p></div><div class="step"><div class="num">03</div><h3>Berikan Review</h3><p>Pelanggan diarahkan ke link Google Review bisnis Anda.</p></div></div></div></section>
<section id="produk"><div class="container"><div class="section-head"><h2>Dibuat untuk bisnis lokal.</h2><p>Letakkan kartu di titik yang paling sering dilewati pelanggan.</p></div><div class="features">
<div class="feature"><div class="icon">⚡</div><h3>Lebih cepat</h3><p>NFC membuat pelanggan tidak perlu membuka kamera untuk memulai.</p></div>
<div class="feature"><div class="icon">🔗</div><h3>Link fleksibel</h3><p>Google Review URL tersimpan di sistem, bukan di kartu fisik.</p></div>
<div class="feature"><div class="icon">📊</div><h3>Siap dianalisis</h3><p>Struktur RIC dapat mencatat interaksi NFC, QR, dan redirect.</p></div>
</div></div></section>
<section><div class="container"><div class="section-head"><h2>Cocok untuk berbagai bisnis</h2><p>Satu konsep yang mudah ditempatkan di counter, meja, resepsionis, atau kasir.</p></div><div class="businesses">${["☕ Cafe","🍽️ Restoran","🏨 Hotel","✂️ Salon","💈 Barbershop","🛍️ Retail","🔧 Bengkel","🏥 Klinik","💼 Jasa","🏪 Toko"].map(x=>`<div class="business">${x}</div>`).join("")}</div></div></section>
<section><div class="container"><div class="cta"><div><h2>Mulai kelola kartu RIC.</h2><p>Aktifkan kartu, atur link Google Review, dan kelola konfigurasi bisnis Anda.</p></div><a class="btn" style="background:#fff;color:#1558d6" href="/kelola-kartu">Kelola Kartu →</a></div></div></section>
</main>`);
}
function manage(){
return layout(`<main class="page"><div class="container"><div class="center"><h1 class="page-title">Kelola Kartu RIC</h1><p class="page-sub">Masukkan Card ID dari kartu Anda untuk mengakses aktivasi atau pengelolaan kartu.</p><div class="panel">
<div class="field"><label>Card ID</label><input id="cardInput" placeholder="Contoh: RIC-000001" autocomplete="off"></div>
<button class="btn btn-primary" style="width:100%" onclick="openCard()">Lanjutkan</button>
<div class="note">Tip: Anda juga dapat membuka URL kartu langsung setelah QR/NFC dibaca, misalnya <b>/c/RIC-000001</b>.</div>
<div id="manageMsg"></div>
</div></div></div></main>`);
}
function openCard(){
const id=document.getElementById("cardInput").value.trim().toUpperCase(), cards=getCards(), card=cards[id], msg=document.getElementById("manageMsg");
if(!card){msg.innerHTML='<div class="error">Card ID tidak ditemukan.</div>';return}
if(card.status==="inactive"){location.href="/aktivasi/"+encodeURIComponent(id);return}
const pin=prompt("Masukkan PIN kartu RIC:");
if(pin===card.pin){sessionStorage.setItem("ric_auth_"+id,"1");location.href="/dashboard/"+encodeURIComponent(id)}
else msg.innerHTML='<div class="error">PIN salah.</div>';
}
function activate(id){
const cards=getCards(), card=cards[id];
if(!card)return layout(`<main class="page"><div class="container center"><div class="error">Kartu tidak ditemukan.</div></div></main>`);
return layout(`<main class="page"><div class="container center"><h1 class="page-title">Aktivasi Kartu</h1><p class="page-sub">Aktifkan <b>${esc(id)}</b> dan hubungkan dengan Google Review bisnis Anda.</p><div class="panel">
<div class="field"><label>Nama Bisnis</label><input id="businessName" placeholder="Contoh: RIC Cafe"></div>
<div class="field"><label>Nama Pemilik</label><input id="ownerName" placeholder="Nama pemilik"></div>
<div class="field"><label>Nomor WhatsApp</label><input id="phone" placeholder="+62..."></div>
<div class="field"><label>Alamat Bisnis</label><textarea id="address" rows="3" placeholder="Alamat bisnis"></textarea></div>
<div class="field"><label>Google Review URL</label><input id="review" placeholder="https://g.page/r/.../review"></div>
<div class="field"><label>PIN (minimal 4 digit)</label><input id="pin" type="password" inputmode="numeric" maxlength="12"></div>
<div class="field"><label>Konfirmasi PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="12"></div>
<button class="btn btn-primary" style="width:100%" onclick="doActivate('${esc(id)}')">Aktifkan Kartu</button>
<div id="actMsg"></div>
</div></div></main>`);
}
function doActivate(id){
const cards=getCards(), name=document.getElementById("businessName").value.trim(), owner=document.getElementById("ownerName").value.trim(), phone=document.getElementById("phone").value.trim(), address=document.getElementById("address").value.trim(), review=document.getElementById("review").value.trim(), pin=document.getElementById("pin").value, pin2=document.getElementById("pin2").value, msg=document.getElementById("actMsg");
if(!name||!owner||!review||pin.length<4||pin!==pin2){msg.innerHTML='<div class="error">Lengkapi data, pastikan URL review terisi, PIN minimal 4 digit dan kedua PIN sama.</div>';return}
try{new URL(review)}catch(e){msg.innerHTML='<div class="error">Google Review URL tidak valid.</div>';return}
cards[id]={...cards[id],status:"active",businessName:name,ownerName:owner,phone,address,googleReviewUrl:review,pin,activatedAt:new Date().toISOString().slice(0,10),events:{...(cards[id].events||{}),activation:1}};saveCards(cards);
msg.innerHTML='<div class="success">Kartu berhasil diaktifkan. Mengarahkan ke dashboard...</div>';sessionStorage.setItem("ric_auth_"+id,"1");setTimeout(()=>location.href="/dashboard/"+encodeURIComponent(id),700);
}
function dashboard(id){
const cards=getCards(), card=cards[id];
if(!card)return layout(`<main class="page"><div class="container center"><div class="error">Kartu tidak ditemukan.</div></div></main>`);
if(sessionStorage.getItem("ric_auth_"+id)!=="1")return layout(`<main class="page"><div class="container center"><div class="panel"><h2>Akses dilindungi PIN</h2><p class="muted">Masukkan PIN melalui halaman Kelola Kartu.</p><a class="btn btn-primary" href="/kelola-kartu">Kembali</a></div></div></main>`);
const url=location.origin+"/c/"+encodeURIComponent(id);
const qr="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="+encodeURIComponent(url);
return layout(`<main class="page"><div class="container"><div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap"><div><h1 class="page-title">Dashboard Kartu</h1><p class="page-sub">Kelola konfigurasi <b>${esc(id)}</b>.</p></div><span class="status active">● AKTIF</span></div>
<div class="dashboard-grid"><div class="stat">Total Interaksi<b>${(card.events?.nfc_visit||0)+(card.events?.qr_visit||0)}</b><span class="muted">NFC + QR</span></div><div class="stat">NFC Tap<b>${card.events?.nfc_visit||0}</b><span class="muted">Demo analytics</span></div><div class="stat">Review Redirect<b>${card.events?.review_redirect||0}</b><span class="muted">Demo analytics</span></div></div>
<div class="manage-grid"><div class="panel"><h3>Informasi Bisnis</h3><div class="field"><label>Nama Bisnis</label><input id="dName" value="${esc(card.businessName)}"></div><div class="field"><label>Nama Pemilik</label><input id="dOwner" value="${esc(card.ownerName)}"></div><div class="field"><label>WhatsApp</label><input id="dPhone" value="${esc(card.phone)}"></div><div class="field"><label>Alamat</label><textarea id="dAddress" rows="3">${esc(card.address)}</textarea></div><button class="btn btn-primary" onclick="saveBusiness('${esc(id)}')">Simpan Perubahan</button><div id="saveMsg"></div></div>
<div class="panel"><h3>Google Review</h3><div class="field"><label>Google Review URL</label><input id="dReview" value="${esc(card.googleReviewUrl)}"></div><button class="btn btn-primary" onclick="saveReview('${esc(id)}')">Update Link Review</button><div class="note">URL kartu: <b>${esc(url)}</b></div><a class="btn btn-secondary" href="/c/${encodeURIComponent(id)}" target="_blank">Tes Kartu ↗</a><div class="qr"><img src="${qr}" alt="QR Code ${esc(id)}"></div><button class="btn btn-secondary" onclick="navigator.clipboard.writeText('${esc(url)}')">Copy URL Kartu</button></div>
<div class="panel"><h3>Keamanan</h3><div class="field"><label>PIN Lama</label><input id="oldPin" type="password"></div><div class="field"><label>PIN Baru</label><input id="newPin" type="password"></div><div class="field"><label>Konfirmasi PIN</label><input id="newPin2" type="password"></div><button class="btn btn-secondary" onclick="changePin('${esc(id)}')">Ubah PIN</button><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Reset Kartu</h3><p class="muted">Reset menghapus konfigurasi bisnis dari kartu ini.</p><button class="btn" style="background:#fff1f2;color:#b42318" onclick="resetCard('${esc(id)}')">Reset Kartu</button><div id="secMsg"></div></div></div>
</div></main>`);
}
function saveBusiness(id){const c=getCards(),x=c[id];x.businessName=document.getElementById("dName").value.trim();x.ownerName=document.getElementById("dOwner").value.trim();x.phone=document.getElementById("dPhone").value.trim();x.address=document.getElementById("dAddress").value.trim();x.updatedAt=new Date().toISOString();saveCards(c);document.getElementById("saveMsg").innerHTML='<div class="success">Informasi tersimpan.</div>'}
function saveReview(id){const c=getCards(),url=document.getElementById("dReview").value.trim(),m=document.getElementById("saveMsg");try{new URL(url)}catch(e){m.innerHTML='<div class="error">URL tidak valid.</div>';return}c[id].googleReviewUrl=url;c[id].updatedAt=new Date().toISOString();saveCards(c);m.innerHTML='<div class="success">Google Review URL diperbarui.</div>'}
function changePin(id){const c=getCards(),old=document.getElementById("oldPin").value,n=document.getElementById("newPin").value,n2=document.getElementById("newPin2").value,m=document.getElementById("secMsg");if(old!==c[id].pin||n.length<4||n!==n2){m.innerHTML='<div class="error">PIN lama salah atau PIN baru tidak valid.</div>';return}c[id].pin=n;saveCards(c);m.innerHTML='<div class="success">PIN berhasil diubah.</div>'}
function resetCard(id){if(!confirm("Yakin ingin mereset kartu ini?"))return;const c=getCards();c[id]={...c[id],status:"inactive",businessName:"",ownerName:"",phone:"",address:"",googleReviewUrl:"",pin:"",activatedAt:""};saveCards(c);sessionStorage.removeItem("ric_auth_"+id);location.href="/kelola-kartu"}
function cardPage(id){
const c=getCards(),card=c[id];
if(!card)return layout(`<main class="page"><div class="container review-box"><h1>Kartu tidak ditemukan</h1><p class="muted">Periksa kembali QR Code atau NFC kartu RIC Anda.</p><a class="btn btn-primary" href="/">Kembali ke RIC</a></div></main>`);
if(card.status==="inactive")return activate(id);
card.events=card.events||{};card.events.review_redirect=(card.events.review_redirect||0)+1;saveCards(c);
setTimeout(()=>{location.href=card.googleReviewUrl},250);
return layout(`<main class="page"><div class="container review-box"><div class="stars">★★★★★</div><h1>Menghubungkan Anda ke Google Review...</h1><p class="muted">Mohon tunggu sebentar.</p><a class="btn btn-secondary" href="${esc(card.googleReviewUrl)}">Lanjutkan sekarang</a></div></main>`);
}
function help(){

function route(){
let p=location.pathname.replace(/\/+$/,"")||"/";
if(p==="/")document.getElementById("app").innerHTML=home();
else if(p==="/kelola-kartu")document.getElementById("app").innerHTML=manage();
else if(p==="/bantuan")document.getElementById("app").innerHTML=help();
else if(p.startsWith("/aktivasi/"))document.getElementById("app").innerHTML=activate(decodeURIComponent(p.split("/")[2]||""));
else if(p.startsWith("/dashboard/"))document.getElementById("app").innerHTML=dashboard(decodeURIComponent(p.split("/")[2]||""));
else if(p.startsWith("/c/"))document.getElementById("app").innerHTML=cardPage(decodeURIComponent(p.split("/")[2]||""));
else document.getElementById("app").innerHTML=home();
}
route();
</script>
