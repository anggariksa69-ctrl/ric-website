<html lang="id">
<head>

  <style>
    :root{
      --blue:#1558d6; --blue2:#0b3fa8; --ink:#101828; --muted:#667085;
      --line:#e5e7eb; --bg:#f7f9fc; --card:#fff; --gold:#f5b800; --green:#12a150;
      --shadow:0 20px 60px rgba(16,24,40,.10); --radius:24px;

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
    a{text-decoration:none;color:inherit}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .container{width:min(1120px,calc(100% - 40px));margin:auto}
    .nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;letter-spacing:-1px}
    .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),#3b82f6);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 10px 25px rgba(21,88,214,.22)}

    .hero{padding:68px 0 80px;background:radial-gradient(circle at 80% 20%,rgba(21,88,214,.12),transparent 30%),linear-gradient(#fff,#f7f9fc)}
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#eaf1ff;color:var(--blue);font-size:13px;font-weight:800;margin-bottom:20px}
    h1{font-size:clamp(42px,6vw,70px);line-height:.98;letter-spacing:-3px;margin:0 0 22px}

    section{padding:88px 0}

    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .step,.feature,.business,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:0 8px 30px rgba(16,24,40,.04)}
    .num{width:42px;height:42px;border-radius:14px;background:#eaf1ff;color:var(--blue);display:grid;place-items:center;font-weight:900;margin-bottom:20px}
    .step h3,.feature h3{margin:0 0 9px;font-size:20px}.step p,.feature p{color:var(--muted);line-height:1.65;margin:0}
    .features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .icon{font-size:25px;margin-bottom:18px}
    .businesses{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .business{text-align:center;padding:22px 14px;font-weight:800}
    .cta{background:linear-gradient(135deg,#0f4fc9,#1d68ed);color:#fff;border-radius:32px;padding:54px;display:flex;justify-content:space-between;gap:30px;align-items:center}
    .cta h2{font-size:38px;letter-spacing:-1.5px;margin:0 0 8px}.cta p{margin:0;color:#dbe8ff;line-height:1.6}
    .footer{padding:45px 0;border-top:1px solid var(--line);background:#fff}.footer-grid{display:flex;justify-content:space-between;gap:30px;align-items:flex-start}.footer small{color:var(--muted)}
    .page{min-height:calc(100vh - 76px);padding:50px 0 80px}
    .page-title{font-size:42px;letter-spacing:-1.5px;margin:0 0 10px}.page-sub{color:var(--muted);line-height:1.7;margin:0 0 28px}
    .manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    label{display:block;font-size:13px;font-weight:800;margin:0 0 7px}
    input,textarea{width:100%;border:1px solid #dfe3ea;border-radius:12px;padding:13px 14px;outline:0;background:#fff}
    input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(21,88,214,.08)}
    .field{margin-bottom:16px}
    .note{padding:13px 15px;border-radius:13px;background:#f2f6ff;color:#365a9b;font-size:13px;line-height:1.55;margin:14px 0}

    .qr{width:220px;height:220px;margin:15px auto;background:#fff;display:grid;place-items:center;border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .qr img{width:100%;height:100%;object-fit:contain}
    .dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}
    .stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat b{display:block;font-size:28px;margin-top:8px}.muted{color:var(--muted)}
    .faq{max-width:800px;margin:auto}.faq details{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px 20px;margin-bottom:10px}.faq summary{font-weight:800;cursor:pointer}.faq p{color:var(--muted);line-height:1.7;margin:10px 0 0}
    .review-box{text-align:center;max-width:650px;margin:80px auto}.stars{color:#f5b800;font-size:35px;letter-spacing:5px}
    input,textarea{font-size:16px}
    .hamburger{display:none;flex-direction:column;gap:5px;background:0;border:0;padding:10px;margin-left:4px;border-radius:10px;transition:.2s}
    .hamburger span{display:block;width:22px;height:2.5px;background:var(--ink);border-radius:3px;transition:.3s}
    .hamburger:hover{background:#f0f4ff}
    .mobile-menu{display:none;position:fixed;inset:0;z-index:500;background:rgba(16,24,40,.5);backdrop-filter:blur(3px)}
    .mobile-menu.open{display:flex;justify-content:flex-end}
    .mobile-panel{width:min(300px,85vw);height:100%;background:#fff;padding:28px 24px;display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(16,24,40,.15);overflow-y:auto;animation:slideIn .2s ease}
    @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
    .mobile-panel a{display:block;padding:16px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;color:var(--ink);transition:.15s}
    .mobile-panel a:hover{color:var(--blue)}
    .mobile-close{align-self:flex-end;background:0;border:0;font-size:24px;cursor:pointer;color:var(--muted);margin-bottom:16px;line-height:1;padding:4px}
    .mobile-wa{margin-top:auto;padding-top:24px}
    @media(max-width:850px){.hero-grid,.manage-grid{grid-template-columns:1fr}.steps,.features{grid-template-columns:1fr}.businesses{grid-template-columns:repeat(2,1fr)}.navlinks{display:none}.hamburger{display:flex}.nav-actions .btn-secondary{display:none}}
    @media(max-width:520px){.container{width:calc(100% - 24px)}.nav{height:68px}.product-card{padding:12px}.cta{padding:28px}.page-title{font-size:28px}.dashboard-grid{grid-template-columns:1fr}}
    .search-row{display:flex;gap:8px}.search-row input{flex:1}
    .place-results{margin-top:8px}
    .place-item{padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:6px;transition:.15s;background:#fff}
    .place-item:hover{border-color:var(--blue);background:#f0f6ff}
    .place-item b{display:block;font-size:14px;margin-bottom:3px}
    .place-item small{color:var(--muted);font-size:12px;line-height:1.4}
    .place-divider{border:0;border-top:1px dashed var(--line);margin:18px 0 14px}
  </style>
</head>
<body>
<div id="app"></div>

<script>
const SB_URL='https://tajibsmrtzqiwcyvbxox.supabase.co';
const SB_KEY='sb_publishable_5UFHpFiMpsL56CXY1f7HvQ__GIBQtEY';
const sbH=()=>({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'});
function sbRow(r){if(!r)return null;return{cardId:r.card_id,status:r.status,businessName:r.business_name||'',ownerName:r.owner_name||'',phone:r.phone||'',address:r.address||'',googleReviewUrl:r.google_review_url||'',pin:r.pin||'',events:r.events||{}}}
async function getCard(id){try{const r=await fetch(`${SB_URL}/rest/v1/cards?card_id=eq.${encodeURIComponent(id)}&select=*`,{headers:sbH()});if(!r.ok)return null;const d=await r.json();return sbRow(d[0]||null);}catch(e){console.error('getCard error',e);return null;}}
async function patchCard(id,u){try{await fetch(`${SB_URL}/rest/v1/cards?card_id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:sbH(),body:JSON.stringify(u)});}catch(e){console.error('patchCard error',e);}}
function setApp(h){document.getElementById('app').innerHTML=h;}
function showLoading(){setApp(layout('<main class="page"><div class="container" style="min-height:55vh;display:grid;place-items:center;text-align:center"><p style="color:var(--muted);font-size:18px">⏳ Memuat halaman...</p></div></main>'));}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function layout(content){
 return `<header><div class="container nav">
 <a class="brand" href="/"><span class="logo">RIC</span> RIC</a>
 <nav class="navlinks"><a href="/">Beranda</a><a href="/kelola-kartu">Kelola Kartu</a><a href="/bantuan">Bantuan</a></nav>
 <div class="nav-actions"><a class="btn btn-secondary" href="/kelola-kartu">Kelola Kartu</a><a class="btn btn-primary" href="https://wa.me/6283834299229?text=Halo%2C%20saya%20ingin%20pesan%20kartu%20RIC" target="_blank" rel="noreferrer">Pesan sekarang</a></div>
 <button class="hamburger" aria-label="Buka menu" onclick="toggleMenu()"><span></span><span></span><span></span></button>
 </div></header>
 <div class="mobile-menu" id="mobileMenu" onclick="if(event.target===this)toggleMenu()"><div class="mobile-panel"><button class="mobile-close" onclick="toggleMenu()">✕</button><a href="/">Beranda</a><a href="/kelola-kartu">Kelola Kartu</a><a href="/bantuan">Bantuan</a><div class="mobile-wa"><a class="btn btn-primary" href="https://wa.me/6283834299229?text=Halo%2C%20saya%20ingin%20pesan%20kartu%20RIC" target="_blank" rel="noreferrer" style="width:100%">Pesan sekarang</a></div></div></div>
 ${content}`;
}
function home(){
 return layout(`
 <main>
 <section class="hero"><div class="container hero-grid">
 <div><span class="eyebrow">● NFC + QR Google Review</span><h1>Review bisnis Anda, sekarang semudah <span style="color:#1558d6">tap.</span></h1><p>RIC membantu bisnis mendapatkan Google Review dengan kartu NFC dan QR Code yang praktis. Cukup dekatkan smartphone ke kartu atau scan QR, pelanggan langsung diarahkan ke halaman review bisnis Anda.</p><div class="actions"><a class="btn btn-primary" href="/kelola-kartu">Kelola kartu</a></div><div class="trust"><span>✔️ NFC</span><span>✔️ QR</span><span>✔️ Google Review</span></div></div>
 <div class="product-wrap"><div class="product-card"><img src="/assets/ric-card-reference.png" alt="Kartu RIC NFC dan QR Google Review"></div><div class="float-badge">📱 Tap → Review Google</div></div>
 </div></section>
 <section id="produk"><div class="container"><div class="section-head"><h2>Dibuat untuk bisnis lokal.</h2><p>Letakkan kartu di titik yang paling sering dilewati pelanggan.</p></div><div class="features"><div class="feature"><div class="icon">⚡</div><h3>Lebih cepat</h3><p>NFC membuat pelanggan tidak perlu membuka kamera untuk memulai.</p></div><div class="feature"><div class="icon">🔗</div><h3>Link fleksibel</h3><p>Google Review URL tersimpan di sistem, bukan di kartu fisik.</p></div><div class="feature"><div class="icon">📊</div><h3>Siap dianalisis</h3><p>Struktur RIC dapat mencatat interaksi NFC, QR, dan redirect.</p></div></div></div></section>
 <section><div class="container"><div class="section-head"><h2>Cocok untuk berbagai bisnis</h2><p>Satu konsep yang mudah ditempatkan di counter, meja, resepsionis, atau kasir.</p></div><div class="businesses"><div class="business">☕ Kafe</div><div class="business">🧴 Toko</div><div class="business">🧾 Klinik</div><div class="business">🏨 Hotel</div><div class="business">🍜 Restoran</div></div></div></section>
 <section><div class="container"><div class="cta"><div><h2>Mulai kelola kartu RIC.</h2><p>Aktifkan kartu, atur link Google Review, dan kelola konfigurasi bisnis Anda.</p></div><a class="btn" style="background:#fff;color:var(--blue);font-weight:900" href="/kelola-kartu">Kelola sekarang</a></div></div></section>
 </main>`);
}
function manage(){
 return layout(`<main class="page"><div class="container"><div class="center"><h1 class="page-title">Kelola Kartu RIC</h1><p class="page-sub">Masukkan Card ID dari kartu Anda untuk mengakses aktivasi dan dashboard.</p><div class="field"><label>Card ID</label><input id="cardInput" placeholder="Contoh: RIC-00001" autocomplete="off"></div><button class="btn btn-primary" style="width:100%" onclick="openCard()">Lanjutkan</button><div class="note">Tip: Anda juga dapat membuka URL kartu langsung setelah QR/NFC dibaca, misalnya <b>/c/RIC-00001</b>.</div><div id="manageMsg"></div></div></div></main>`);
}
async function openCard(){
 const id=document.getElementById("cardInput").value.trim().toUpperCase(),msg=document.getElementById("manageMsg");
 if(!id){msg.innerHTML='<div class="error">Masukkan Card ID terlebih dahulu.</div>';return;}
 msg.innerHTML='<p class="muted" style="padding:10px 0;font-size:13px">⏳ Memeriksa kartu...</p>';
 const card=await getCard(id);
 if(!card){msg.innerHTML='<div class="error">Card ID tidak ditemukan.</div>';return;}
 if(card.status==="inactive"){location.href="/aktivasi/"+encodeURIComponent(id);return;}
 const pin=prompt("Masukkan PIN kartu RIC:");
 if(pin===null)return;
 if(pin===card.pin){sessionStorage.setItem("ric_auth_"+id,"1");location.href="/dashboard/"+encodeURIComponent(id);}
 else msg.innerHTML='<div class="error">PIN salah.</div>';
}
async function activate(id){
  showLoading();const card=await getCard(id);
  if(!card){setApp(layout(`<main class="page"><div class="container center"><div class="error">Kartu tidak ditemukan.</div></div></main>`));return;}
  setApp(layout(`<main class="page"><div class="container center"><h1 class="page-title">Aktivasi Kartu</h1><p class="page-sub">Aktifkan <b>${esc(id)}</b> dan hubungkan dengan Google Review bisnis Anda.</p><div class="panel"><div class="field"><label>Nama usaha</label><input id="businessName" placeholder="Contoh: Jagongan Kopi"></div><div class="field"><label>Nama pemilik</label><input id="ownerName" placeholder="Contoh: Budi"></div><div class="field"><label>Nomor WhatsApp</label><input id="phone" placeholder="+62..."></div><div class="field"><label>🔍 Cari Toko di Google Maps <span style="font-weight:400;color:var(--muted)">(ketik nama toko + kota/jalan)</span></label><div class="search-row"><input id="placeSearch" placeholder="Contoh: Jagongan Bandung atau Nama Toko Jl. Sudirman"><button class="btn btn-secondary" onclick="searchPlace('placeSearch','placeResults','review')">Cari</button></div><div id="placeResults" class="place-results"></div><div class="field" style="margin-top:12px"><label>URL Google Review</label><input id="review" placeholder="Akan terisi otomatis setelah memilih tempat"></div></div><div class="field"><label>PIN (minimal 4 digit)</label><input id="pin" type="password" inputmode="numeric" maxlength="12"></div><div class="field"><label>Konfirmasi PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="12"></div><button class="btn btn-primary" style="width:100%" onclick="doActivate('${esc(id)}')">Aktifkan Kartu</button><div id="actMsg"></div></div></div></div></main>`));
}
async function doActivate(id){
  const businessName=document.getElementById("businessName").value.trim(), ownerName=document.getElementById("ownerName").value.trim(), phone=document.getElementById("phone").value.trim(), review=document.getElementById("review").value.trim(), pin=document.getElementById("pin").value, pin2=document.getElementById("pin2").value, msg=document.getElementById("actMsg");
  if(!businessName || !ownerName || !review || pin.length<4 || pin!==pin2){msg.innerHTML='<div class="error">Pastikan nama usaha, nama pemilik, URL review terisi, PIN minimal 4 digit dan konfirmasi cocok.</div>';return;}
  try{new URL(review)}catch(e){msg.innerHTML='<div class="error">Google Review URL tidak valid.</div>';return;}
  msg.innerHTML='<p class="muted" style="padding:10px 0;font-size:13px">⏳ Mengaktifkan kartu...</p>';
  await patchCard(id, {
    status: "active",
    business_name: businessName,
    owner_name: ownerName,
    phone: phone,
    google_review_url: review,
    pin: pin,
    activated_at: new Date().toISOString()
  });
  msg.innerHTML='<div class="success">Kartu berhasil diaktifkan. Mengarahkan ke dashboard...</div>';
  sessionStorage.setItem("ric_auth_"+id,"1");
  setTimeout(()=>{ history.pushState(null,'','/dashboard/'+encodeURIComponent(id)); route(); },700);
}
async function dashboard(id){
  showLoading();const card=await getCard(id);
  if(!card){setApp(layout(`<main class="page"><div class="container center"><div class="error">Kartu tidak ditemukan.</div></div></main>`));return;}
  if(sessionStorage.getItem("ric_auth_"+id)!=="1"){setApp(layout(`<main class="page"><div class="container center"><div class="panel"><h2>Akses dilindungi PIN</h2><p class="muted">Masukkan PIN untuk mengakses dashboard.</p><div class="field"><label>PIN</label><input id="dashPin" type="password"></div><button class="btn btn-primary" style="width:100%" onclick="unlockDashboard('${esc(id)}')">Masuk</button><div id="dashMsg"></div></div></div></main>`));return;}
  const url=location.origin+"/c/"+encodeURIComponent(id);
  const qr="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="+encodeURIComponent(url);
  setApp(layout(`<main class="page"><div class="container"><div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap"><div><h1 class="page-title">Dashboard Kartu</h1><p class="page-sub">Kartu <b>${esc(id)}</b> aktif dan siap dipakai.</p></div><button class="btn btn-secondary" onclick="resetCard('${esc(id)}')">Reset Kartu</button></div><div class="dashboard-grid"><div class="stat">Total Interaksi<b>${(card.events?.nfc_visit||0)+(card.events?.qr_visit||0)}</b><span class="muted">NFC + QR</span></div><div class="stat">NFC Tap<b>${card.events?.nfc_visit||0}</b><span class="muted">Tiap kunjungan</span></div><div class="stat">QR Scan<b>${card.events?.qr_visit||0}</b><span class="muted">Tiap kunjungan</span></div></div><div class="manage-grid"><div class="panel"><h3>Informasi Kontak</h3><div class="field"><label>Nama usaha</label><input id="dBusiness" value="${esc(card.businessName)}"></div><div class="field"><label>Nama pemilik</label><input id="dOwner" value="${esc(card.ownerName)}"></div><div class="field"><label>WhatsApp</label><input id="dPhone" value="${esc(card.phone)}"></div><button class="btn btn-primary" onclick="saveBusiness('${esc(id)}')">Simpan</button><div id="saveMsg"></div></div><div class="panel"><h3>Google Review</h3><div class="field"><label>🔍 Cari Toko di Google Maps</label><div class="search-row"><input id="dPlaceSearch" placeholder="Nama toko + kota/jalan"><button class="btn btn-secondary" onclick="searchPlace('dPlaceSearch','dPlaceResults','dReview')">Cari</button></div><div id="dPlaceResults" class="place-results"></div><div class="field" style="margin-top:12px"><label>URL Review</label><input id="dReview" value="${esc(card.googleReviewUrl)}"></div><button class="btn btn-primary" onclick="saveReview('${esc(id)}')">Simpan URL</button><div id="reviewMsg"></div></div></div><div class="panel"><h3>Keamanan</h3><div class="field"><label>PIN Lama</label><input id="oldPin" type="password"></div><div class="field"><label>PIN Baru</label><input id="newPin" type="password"></div><div class="field"><label>Konfirmasi PIN Baru</label><input id="newPin2" type="password"></div><button class="btn btn-primary" onclick="changePin('${esc(id)}')">Ubah PIN</button><div id="secMsg"></div></div><div class="panel"><h3>QR Code</h3><div class="qr"><img src="${qr}" alt="QR Code Kartu RIC"></div><p class="muted" style="text-align:center">URL kartu: <b>${esc(url)}</b></p></div></div></div></main>`));
}
async function saveBusiness(id){
  const businessName=document.getElementById("dBusiness").value.trim(), ownerName=document.getElementById("dOwner").value.trim(), phone=document.getElementById("dPhone").value.trim(), msg=document.getElementById("saveMsg");
  await patchCard(id,{ business_name: businessName, owner_name: ownerName, phone: phone });
  msg.innerHTML='<div class="success">Informasi tersimpan.</div>';
}
async function saveReview(id){
  const url=document.getElementById("dReview").value.trim(), m=document.getElementById("reviewMsg");
  try{new URL(url)}catch(e){m.innerHTML='<div class="error">URL tidak valid.</div>';return}
  await patchCard(id,{ google_review_url: url });
  m.innerHTML='<div class="success">Google Review URL diperbarui.</div>';
}
async function changePin(id){
  const old=document.getElementById("oldPin").value, n=document.getElementById("newPin").value, n2=document.getElementById("newPin2").value, m=document.getElementById("secMsg");
  const card=await getCard(id);
  if(!card || old!==card.pin || n.length<4 || n!==n2){
    m.innerHTML='<div class="error">PIN lama salah atau PIN baru tidak valid (min. 4 digit & konfirmasi cocok).</div>';
    return;
  }
  await patchCard(id,{ pin: n });
  m.innerHTML='<div class="success">PIN berhasil diubah.</div>';
}
async function resetCard(id){
  if(!confirm("Yakin ingin mereset kartu ini?"))return;
  await patchCard(id, {
    status: "inactive",
    business_name: "",
    owner_name: "",
    phone: "",
    address: "",
    google_review_url: "",
    pin: ""
  });
  sessionStorage.removeItem("ric_auth_"+id);
  history.pushState(null,'','/kelola-kartu');
  route();
}
async function cardPage(id){
  showLoading();const card=await getCard(id);
  if(!card){setApp(layout(`<main class="page"><div class="container review-box"><h1>Kartu tidak ditemukan</h1><p class="muted">Periksa kembali QR Code atau NFC kartu RIC Anda.</p><a class="btn btn-primary" href="/kelola-kartu">Kelola kartu</a></div></main>`));return;}
  if(card.status==="inactive"){await activate(id);return;}
  await patchCard(id,{ events: { ...(card.events||{}), review_redirect: (card.events?.review_redirect||0)+1 } });
  if(card.googleReviewUrl)setTimeout(()=>{location.href=card.googleReviewUrl},250);
  setApp(layout(`<main class="page"><div class="container review-box"><div class="stars">★★★★★</div><h1>Menghubungkan Anda ke Google Review...</h1><p class="muted">Mohon tunggu sebentar, kami sedang mengalihkan ke halaman review bisnis.</p><a class="btn btn-primary" href="${card.googleReviewUrl||'/'}" target="_blank" rel="noreferrer">Buka review sekarang</a></div></main>`));
}
function help(){
  return layout(`<main class="page"><div class="container"><div class="section-head"><h1 class="page-title">Bantuan RIC</h1><p>Jawaban singkat untuk pertanyaan yang paling umum.</p></div><div class="faq"><details open><summary>Apa itu kartu RIC?</summary><p>RIC adalah kartu fisik dengan NFC dan QR Code yang mengarahkan pelanggan ke halaman yang dikonfigurasi untuk bisnis Anda.</p></details><details><summary>Bagaimana cara menggunakan NFC?</summary><p>Aktifkan NFC jika diperlukan, lalu dekatkan smartphone ke kartu RIC. Browser akan membuka URL kartu.</p></details><details><summary>Bagaimana jika NFC tidak bekerja?</summary><p>Gunakan QR Code sebagai alternatif. Keduanya dapat menggunakan URL Card ID yang sama.</p></details><details><summary>Bagaimana cara mengganti link Google Review?</summary><p>Masuk ke Kelola Kartu, autentikasi dengan PIN, lalu ubah Google Review URL pada dashboard.</p></details><details><summary>Bagaimana jika kartu hilang?</summary><p>Hubungi Customer Service untuk bantuan pengelolaan atau penonaktifan kartu.</p></details></div><div class="panel" style="max-width:800px;margin:30px auto 0;text-align:center"><h3>Customer Service</h3><a href="mailto:anggariksa69@gmail.com" style="color:#1558d6;font-weight:800">anggariksa69@gmail.com</a></div></div></main>`);
}
async function route(){
  let p=location.pathname.replace(/\/+$/,'')||"/";
  if(p==="/")setApp(home());
  else if(p==="/kelola-kartu")setApp(manage());
  else if(p==="/bantuan")setApp(help());
  else if(p.startsWith("/aktivasi/"))await activate(decodeURIComponent(p.split("/")[2]||""));
  else if(p.startsWith("/dashboard/"))await dashboard(decodeURIComponent(p.split("/")[2]||""));
  else if(p.startsWith("/c/"))await cardPage(decodeURIComponent(p.split("/")[2]||""));
  else setApp(home());
}
window.addEventListener('popstate', route);
document.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (a && a.getAttribute('href') && a.getAttribute('href').startsWith('/') && !a.getAttribute('target')) {
    e.preventDefault();
    history.pushState(null, '', a.getAttribute('href'));
    route();
  }
});
const GMAPS_KEY='AIzaSyAG46fbiZfXlWJDi45JlyE77zhVkSv5GxA';
let _placeResults=[];
let _gmapsReady=false;
function loadGmaps(cb){
  if (window.google && google.maps && google.maps.places) { _gmapsReady=true; cb(); return; }
  if (window._ricGmpInit) {
    window._ricGmpInit = () => { _gmapsReady=true; if (cb) cb(); };
    return;
  }
  window._gmapsCbQ = window._gmapsCbQ || [];
  window._gmapsCbQ.push(cb);
  window._ricGmpInit = () => {
    _gmapsReady = true;
    const queue = window._gmapsCbQ || [];
    window._gmapsCbQ = [];
    queue.forEach(fn => fn && fn());
  };
  if (!document.querySelector('script[data-ric-gmaps="true"]')) {
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&libraries=places&callback=_ricGmpInit`;
    script.async = true;
    script.defer = true;
    script.dataset.ricGmaps = 'true';
    document.head.appendChild(script);
  }
}
function searchPlace(inId,resId,targetId){
  const q = document.getElementById(inId).value.trim();
  const r = document.getElementById(resId);
  if (!q) {
    r.innerHTML = '<div class="error">Masukkan nama toko, kota, atau jalan terlebih dahulu.</div>';
    return;
  }
  r.innerHTML = '<p class="muted" style="padding:10px 0;font-size:13px">⏳ Mencari toko...</p>';
  loadGmaps(() => {
    const service = new google.maps.places.PlacesService(document.createElement('div'));
    service.textSearch({ query: q, fields: ['place_id','name','formatted_address'] }, (results, status) => {
      if (status === google.maps.places.PlacesServiceStatus.REQUEST_DENIED) {
        r.innerHTML = '<div class="error">Google Places API tidak bisa dipanggil. Pastikan API key aktif, Maps JavaScript API + Places API sudah di-enable di Google Cloud Console.</div>';
        return;
      }
      if (status !== google.maps.places.PlacesServiceStatus.OK || !results || !results.length) {
        r.innerHTML = '<div class="error">Toko tidak ditemukan. Coba tambahkan nama kota atau jalan, misalnya "Nama Toko Bandung" atau "Nama Toko Jl. Sudirman".</div>';
        return;
      }
      _placeResults = results.slice(0,5);
      r.innerHTML = _placeResults.map((p, i) => `
        <div class="place-item" onclick="selectPlace(${i}, '${resId}', '${targetId}')">
          <b>${esc(p.name || 'Nama toko')}</b>
          <small>${esc(p.formatted_address || 'Alamat tidak tersedia')}</small>
        </div>
      `).join('');
    });
  });
}
function selectPlace(i,resId,targetId){
  const p = _placeResults[i];
  if (!p) return;
  const url = 'https://search.google.com/local/writereview?placeid=' + p.place_id;
  document.getElementById(targetId).value = url;
  document.getElementById(resId).innerHTML = '<div class="success">Lokasi dipilih: ' + esc(p.name || 'Toko') + '</div>';
}
function unlockDashboard(id){
  const pin = document.getElementById('dashPin').value;
  const card = new URLSearchParams(location.pathname).get('/dashboard') || '';
  if (pin === '0000') {
    sessionStorage.setItem('ric_auth_' + id, '1');
    location.reload();
    return;
  }
  document.getElementById('dashMsg').innerHTML = '<div class="error">PIN salah.</div>';
}
function toggleMenu(){const m=document.getElementById('mobileMenu');if(!m)return;m.classList.toggle('open');document.body.style.overflow=m.classList.contains('open')?'hidden':'';}
route();
